<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle-container">
            <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode">🌓</button>
        </div>
        <header>
            <h1>Lotto Number Generator</h1>
        </header>
        <main>
            <div id="lotto-numbers" class="lotto-numbers-container"></div>
            <button id="generate-btn" class="generate-button">Generate Numbers</button>

            <section class="contact-section">
                <h2>제휴 문의</h2>
                <form action="https://formspree.io/f/mzdylglk" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" required placeholder="성함을 입력해주세요">
                    </div>
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea id="message" name="message" required placeholder="문의하실 내용을 입력해주세요"></textarea>
                    </div>
                    <button type="submit" class="submit-button">문의 보내기</button>
                </form>
            </section>

            <section class="comments-section">
                <h2>댓글</h2>
                <div id="disqus_thread"></div>
                <script>
                    /**
                    *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                    *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
                    /*
                    var disqus_config = function () {
                    this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                    this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                    };
                    */
                    (function() { // DON'T EDIT BELOW THIS LINE
                    var d = document, s = d.createElement('script');
                    s.src = 'https://https-supreme1-sdsd2002v-workers-dev.disqus.com/embed.js';
                    s.setAttribute('data-timestamp', +new Date());
                    (d.head || d.body).appendChild(s);
                    })();
                </script>
                <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
            </section>
        </main>
        <footer>
            <p>&copy; 2023 Lotto Number Generator</p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>
</html>
